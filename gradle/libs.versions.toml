[versions]
agp = "9.3.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
compile-sdk = "37"
target-sdk = "36"
min-sdk = "26"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
room = "2.8.5"
okhttp = "5.5.1"
jupnp = "3.0.5"
ktor = "3.6.0"
serialization = "1.12.0"
coroutines = "1.11.0"
datastore = "1.1.1"
junit = "4.13.2"

[libraries]
# Core-safe (JVM) dependencies. Wired only where a story needs them.
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# TV-network stack. Declared here so later stories wire exact pins; unused in this story.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jupnp = { module = "org.jupnp:org.jupnp", version.ref = "jupnp" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Persistence / injection stack. DataStore holds the retained LAN-gate
# decision (story 1.4); Room and Hilt arrive with their stories.
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
# Compose shell stack. Versions for ui/foundation/material3 are BOM-managed.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
# Tests.
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
